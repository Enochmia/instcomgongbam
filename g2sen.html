<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>에이징 테스트 G2 - 키패드 순서 기억 (진행자용)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&family=JetBrains+Mono:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            title: ['"Black Han Sans"', 'sans-serif'],
            sans: ['"Noto Sans KR"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 18%, #0d281a 0%, #07150e 55%, #020704 100%);
      min-height: 100vh;
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* 3x3 키패드 기본 셀 */
    .keypad-cell {
      transition: all 0.08s ease-out;
      border: 2px solid rgba(255, 255, 255, 0.12);
      background: rgba(18, 30, 23, 0.85);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.08), 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* 번호 점등 시 초강력 골든 앰버 플래시 */
    .keypad-cell.active-flash {
      background: radial-gradient(circle, #fffbe6 0%, #fbbf24 40%, #ea580c 100%) !important;
      border-color: #ffffff !important;
      color: #1e1b18 !important;
      transform: scale(1.05);
      box-shadow: 
        0 0 25px #f59e0b,
        0 0 65px rgba(245, 158, 11, 0.95),
        0 0 115px rgba(234, 88, 12, 0.8),
        inset 0 0 18px #ffffff !important;
      z-index: 20;
    }

    /* 버튼 공통 반응 */
    .host-btn {
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: manipulation;
    }
    .host-btn:active:not(:disabled) {
      transform: scale(0.96);
    }
    .host-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(80%);
    }

    /* 1초 준비 집중 딤/블러 트랜지션 */
    #focus-dim-overlay {
      transition: opacity 0.28s ease-in-out;
    }
  </style>
</head>
<body class="flex flex-col justify-between h-screen p-5 lg:p-7 max-w-5xl mx-auto">

  <!-- ================= 상단 바 (라운드 토글 & 단일 타이틀) ================= -->
  <header class="w-full flex flex-col items-center justify-center border-b border-white/10 pb-4 gap-3">
    <!-- 라운드 선택 버튼 (G1/G2 플레이어 앱 규격 일치) -->
    <div class="flex items-center gap-2 p-1 bg-black/40 rounded-xl border border-white/10">
      <button onclick="switchRound(1)" id="btn-round-1" class="px-5 py-1.5 rounded-lg text-xs font-black transition-all bg-emerald-500 text-slate-950 shadow-md">
        ROUND 1
      </button>
      <button onclick="switchRound(2)" id="btn-round-2" class="px-5 py-1.5 rounded-lg text-xs font-black transition-all bg-transparent text-slate-400 hover:text-white">
        ROUND 2
      </button>
    </div>

    <!-- 타이틀 배지 -->
    <div class="flex items-center gap-3">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <h1 id="header-title-badge" class="text-2xl sm:text-3xl font-black tracking-wide font-mono text-amber-400">
        에이징 테스트 G2 / St1
      </h1>
    </div>
  </header>

  <!-- ================= 중앙 메인: 1~9 순수 3x3 키패드 ================= -->
  <main class="relative flex-1 flex flex-col items-center justify-center my-auto">
    
    <!-- 1초 집중 딤/블러 오버레이 -->
    <div id="focus-dim-overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black/65 backdrop-blur-md rounded-3xl pointer-events-none opacity-0">
      <div class="flex items-center gap-2 px-6 py-3 rounded-full bg-black/80 border border-amber-400/50 text-amber-300 text-base font-bold shadow-2xl animate-pulse">
        <i class="fa-solid fa-crosshairs text-amber-400"></i>
        <span>집중하세요...</span>
      </div>
    </div>

    <!-- 3x3 키패드 컨테이너 -->
    <div id="keypad-container" class="w-full max-w-[430px] lg:max-w-[470px] aspect-square p-4 rounded-3xl bg-black/40 backdrop-blur-md border border-white/15 shadow-[0_20px_60px_rgba(0,0,0,0.85)] flex items-center justify-center">
      
      <!-- 1 ~ 9 순수 3x3 그리드 -->
      <div class="w-full h-full grid grid-cols-3 gap-3 lg:gap-4">
        <div id="pad-1" class="keypad-cell rounded-2xl flex items-center justify-center font-title text-4xl lg:text-5xl text-white">1</div>
        <div id="pad-2" class="keypad-cell rounded-2xl flex items-center justify-center font-title text-4xl lg:text-5xl text-white">2</div>
        <div id="pad-3" class="keypad-cell rounded-2xl flex items-center justify-center font-title text-4xl lg:text-5xl text-white">3</div>
        <div id="pad-4" class="keypad-cell rounded-2xl flex items-center justify-center font-title text-4xl lg:text-5xl text-white">4</div>
        <div id="pad-5" class="keypad-cell rounded-2xl flex items-center justify-center font-title text-4xl lg:text-5xl text-white">5</div>
        <div id="pad-6" class="keypad-cell rounded-2xl flex items-center justify-center font-title text-4xl lg:text-5xl text-white">6</div>
        <div id="pad-7" class="keypad-cell rounded-2xl flex items-center justify-center font-title text-4xl lg:text-5xl text-white">7</div>
        <div id="pad-8" class="keypad-cell rounded-2xl flex items-center justify-center font-title text-4xl lg:text-5xl text-white">8</div>
        <div id="pad-9" class="keypad-cell rounded-2xl flex items-center justify-center font-title text-4xl lg:text-5xl text-white">9</div>
      </div>

    </div>

  </main>

  <!-- ================= 하단 진행자 컨트롤 바 ================= -->
  <footer class="w-full bg-black/40 backdrop-blur-md rounded-2xl border border-white/10 p-3 lg:p-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      
      <!-- 좌측: 스테이지 현황 배지 -->
      <div class="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-mono font-bold text-xs flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-amber-400"></span>
        <span id="stage-meta-text">St 1 (3자)</span>
      </div>

      <!-- 중앙 핵심: 시퀀스 시작 -->
      <button id="btn-play" onclick="startFocusAndPlay()" class="host-btn px-8 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-sm sm:text-base shadow-lg shadow-emerald-950/70 flex items-center gap-2 border-t border-emerald-300/40">
        <i class="fa-solid fa-play"></i>
        <span>시퀀스 시작</span>
      </button>

      <!-- 우측: 정답 팝업 및 다음 스테이지 버튼 -->
      <div class="flex items-center gap-2.5">
        <!-- 정답 팝업 버튼 -->
        <button id="btn-reveal" onclick="openAnswerModal()" class="host-btn px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 border border-white/15 text-slate-200 font-bold text-xs flex items-center gap-1.5">
          <i class="fa-solid fa-file-circle-check text-amber-400"></i>
          <span>정답 확인</span>
        </button>

        <!-- 다음 스테이지 버튼 -->
        <button id="btn-next-stage" onclick="nextStage()" class="host-btn px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs flex items-center gap-1.5 shadow-md shadow-indigo-950/50">
          <span id="next-stage-text">다음 스테이지</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

    </div>
  </footer>

  <!-- ================= 정답 확인 팝업 모달 ================= -->
  <div id="answer-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/20 rounded-3xl w-full max-w-md p-6 shadow-2xl flex flex-col gap-4">
      
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <h3 class="text-base font-black text-white flex items-center gap-2">
          <span class="text-amber-400">📋</span>
          <span id="modal-round-title">ROUND 1 정답표</span>
        </h3>
        <button onclick="closeAnswerModal()" class="text-slate-400 hover:text-white text-xl p-1 leading-none">✕</button>
      </div>

      <!-- st1, st2, st3 답안 리스트 -->
      <div class="space-y-3 font-mono text-sm">
        <div class="p-3 rounded-xl bg-white/5 border border-white/5 flex flex-col gap-1">
          <span class="text-xs font-bold text-emerald-400">st1 (3자리)</span>
          <span id="ans-st1" class="text-white font-bold tracking-wider text-base"></span>
        </div>
        <div class="p-3 rounded-xl bg-white/5 border border-white/5 flex flex-col gap-1">
          <span class="text-xs font-bold text-amber-400">st2 (7자리)</span>
          <span id="ans-st2" class="text-white font-bold tracking-wider text-base"></span>
        </div>
        <div class="p-3 rounded-xl bg-white/5 border border-white/5 flex flex-col gap-1">
          <span class="text-xs font-bold text-rose-400">st3 (12자리)</span>
          <span id="ans-st3" class="text-white font-bold tracking-wider text-base"></span>
        </div>
      </div>

      <div class="pt-2">
        <button onclick="closeAnswerModal()" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white transition-all shadow-md active:scale-95">
          닫기
        </button>
      </div>

    </div>
  </div>

  <!-- ================= 로직 스크립트 ================= -->
  <script>
    // 오디오 비프음 피드백
    let audioCtx = null;
    function playBeep(freq = 660, duration = 0.12, type = 'sine') {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // fail silently
      }
    }

    // ================= 플레이어 앱과 100% 일치하는 하드코딩 정답 데이터 =================
    const HARDCODED_ANSWERS = {
      1: [
        [4, 8, 2],
        [7, 1, 9, 3, 5, 8, 4],
        [6, 2, 9, 1, 5, 7, 3, 8, 4, 2, 9, 5]
      ],
      2: [
        [3, 7, 1],
        [5, 9, 2, 6, 4, 1, 8],
        [8, 4, 1, 7, 3, 9, 2, 6, 5, 8, 1, 4]
      ]
    };

    const STAGE_CONFIGS = [
      { stage: 1, length: 3, lightTime: 270, intervalTime: 120 },
      { stage: 2, length: 7, lightTime: 220, intervalTime: 100 },
      { stage: 3, length: 12, lightTime: 170, intervalTime: 85 }
    ];

    let currentRound = 1;
    let currentStageIndex = 0;
    let isPlaying = false;

    // DOM 캐싱
    const headerTitleBadge = document.getElementById('header-title-badge');
    const stageMetaText = document.getElementById('stage-meta-text');
    const focusDimOverlay = document.getElementById('focus-dim-overlay');
    const btnPlay = document.getElementById('btn-play');
    const btnReveal = document.getElementById('btn-reveal');
    const btnNextStage = document.getElementById('btn-next-stage');
    const nextStageText = document.getElementById('next-stage-text');
    const btnRound1 = document.getElementById('btn-round-1');
    const btnRound2 = document.getElementById('btn-round-2');

    const answerModal = document.getElementById('answer-modal');
    const modalRoundTitle = document.getElementById('modal-round-title');
    const ansSt1 = document.getElementById('ans-st1');
    const ansSt2 = document.getElementById('ans-st2');
    const ansSt3 = document.getElementById('ans-st3');

    // 라운드 전환 (1 <-> 2)
    function switchRound(round) {
      if (isPlaying) return;
      currentRound = round;
      currentStageIndex = 0;

      if (round === 1) {
        btnRound1.className = 'px-5 py-1.5 rounded-lg text-xs font-black transition-all bg-emerald-500 text-slate-950 shadow-md';
        btnRound2.className = 'px-5 py-1.5 rounded-lg text-xs font-black transition-all bg-transparent text-slate-400 hover:text-white';
      } else {
        btnRound1.className = 'px-5 py-1.5 rounded-lg text-xs font-black transition-all bg-transparent text-slate-400 hover:text-white';
        btnRound2.className = 'px-5 py-1.5 rounded-lg text-xs font-black transition-all bg-emerald-500 text-slate-950 shadow-md';
      }

      loadStage(0);
      updateAnswerModalContent();
    }

    // 정답 모달 갱신
    function updateAnswerModalContent() {
      const answers = HARDCODED_ANSWERS[currentRound];
      modalRoundTitle.textContent = `ROUND ${currentRound} 정답표`;
      ansSt1.textContent = answers[0].join(' - ');
      ansSt2.textContent = answers[1].join(' - ');
      ansSt3.textContent = answers[2].join(' - ');
    }

    // 스테이지 로드
    function loadStage(index) {
      if (isPlaying) return;
      currentStageIndex = index;
      const stageNum = STAGE_CONFIGS[currentStageIndex].stage;
      const len = STAGE_CONFIGS[currentStageIndex].length;

      headerTitleBadge.textContent = `에이징 테스트 G2 / St${stageNum}`;
      stageMetaText.textContent = `St ${stageNum} (${len}자)`;

      if (currentStageIndex === STAGE_CONFIGS.length - 1) {
        nextStageText.textContent = '처음으로';
      } else {
        nextStageText.textContent = '다음 스테이지';
      }
    }

    // 다음 스테이지
    function nextStage() {
      if (isPlaying) return;
      const nextIndex = (currentStageIndex + 1) % STAGE_CONFIGS.length;
      loadStage(nextIndex);
    }

    function setControlsDisabled(disabled) {
      isPlaying = disabled;
      btnPlay.disabled = disabled;
      btnReveal.disabled = disabled;
      btnNextStage.disabled = disabled;
      btnRound1.disabled = disabled;
      btnRound2.disabled = disabled;
    }

    // ================= 재생 로직 (1초 딤 후 고속 플래시) =================
    async function startFocusAndPlay() {
      if (isPlaying) return;
      setControlsDisabled(true);

      // 1초간 화면을 살짝 흐리는 집중 효과
      focusDimOverlay.classList.remove('opacity-0');
      focusDimOverlay.classList.add('opacity-100');
      playBeep(440, 0.1, 'sine');

      await new Promise(r => setTimeout(r, 1000));

      focusDimOverlay.classList.remove('opacity-100');
      focusDimOverlay.classList.add('opacity-0');
      await new Promise(r => setTimeout(r, 90));

      await playSequenceAnimation();
    }

    // 고정된 시퀀스 플래시 루프
    async function playSequenceAnimation() {
      const cfg = STAGE_CONFIGS[currentStageIndex];
      const sequence = HARDCODED_ANSWERS[currentRound][currentStageIndex];

      for (let i = 0; i < sequence.length; i++) {
        const num = sequence[i];
        const cell = document.getElementById(`pad-${num}`);

        if (cell) {
          cell.classList.add('active-flash');
          playBeep(520 + (num * 45), cfg.lightTime / 1000, 'square');
        }

        await new Promise(r => setTimeout(r, cfg.lightTime));

        if (cell) {
          cell.classList.remove('active-flash');
        }
        await new Promise(r => setTimeout(r, cfg.intervalTime));
      }

      setControlsDisabled(false);
      playBeep(784, 0.35, 'triangle');
    }

    // 모달 제어
    function openAnswerModal() {
      updateAnswerModalContent();
      answerModal.classList.remove('hidden');
      answerModal.classList.add('flex');
    }

    function closeAnswerModal() {
      answerModal.classList.add('hidden');
      answerModal.classList.remove('flex');
    }

    // 초기 실행
    window.onload = function() {
      switchRound(1);
    };
  </script>
</body>
</html>
